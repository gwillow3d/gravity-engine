[package]
name = "gravityengine"
version = "1.10.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.36.2"
egui = "0.36.2"
env_logger = "0.11.11"
glam = "0.33.12"
log = "0.4.34"
macroquad = "0.4.16"
numfmt = "1.2.0"
rand = "0.10.3"
rayon = "1.12.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
